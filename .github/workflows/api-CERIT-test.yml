
name: CERIT BYOK Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Send a request directly to the CERIT API.
      # This helps us inspect the real response before testing Copilot.
      - name: Check CERIT API directly
        env:
          CERIT_API_KEY: ${{ secrets.CERIT_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CERIT_API_KEY:-}" ]; then
            echo "ERROR: CERIT_API_KEY secret is empty or missing."
            exit 1
          fi

          HTTP_STATUS=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            https://llm.ai.e-infra.cz/v1/chat/completions \
            -H "Authorization: Bearer $CERIT_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-oss-120b",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: CERIT model test successful."
                }
              ],
              "max_tokens": 80,
              "stream": false
            }')

          echo "HTTP status: $HTTP_STATUS"
          echo
          echo "Raw CERIT API response:"

          # Print the response without exposing the API key.
          jq . response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: CERIT returned HTTP $HTTP_STATUS."
            exit 1
          fi

          echo
          echo "Diagnostic request completed."
          echo "Inspect the response above to identify its answer format."

      # STEP 2: Install the GitHub Copilot CLI.
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # STEP 3: Configure Copilot to use CERIT instead of its default provider.
      - name: Test Copilot with CERIT
        env:
          COPILOT_PROVIDER_BASE_URL: https://llm.ai.e-infra.cz/v1
          COPILOT_PROVIDER_API_KEY: ${{ secrets.CERIT_API_KEY }}
          COPILOT_PROVIDER_TYPE: openai
          COPILOT_MODEL: gpt-oss-120b
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: "80"
        run: |
          set -euo pipefail

          if [ -z "${COPILOT_PROVIDER_API_KEY:-}" ]; then
            echo "ERROR: CERIT API key is missing."
            exit 1
          fi

          copilot -p \
            "Reply with exactly: CERIT Copilot test successful." \
            --model gpt-oss-120b \
            --silent \
            --no-ask-user \
            > copilot-output.txt

          echo "Copilot response:"
          cat copilot-output.txt

          if [ ! -s copilot-output.txt ]; then
            echo "ERROR: Copilot returned an empty response."
            exit 1
          fi

          if ! grep -Fq \
            "CERIT Copilot test successful." \
            copilot-output.txt; then
            echo "ERROR: Expected text was not found in the response."
            exit 1
          fi

          echo "SUCCESS: Copilot returned the expected text."

          {
            echo "## CERIT Copilot Test"
            echo
            cat copilot-output.txt
            echo
            echo "Copilot returned the expected response."
          } >> "$GITHUB_STEP_SUMMARY"
