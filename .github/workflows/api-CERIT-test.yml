
name: CERIT BYOK Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # TEST 1: Ask the CERIT model a real question.
      - name: Ask CERIT how it is
        env:
          CERIT_API_KEY: ${{ secrets.CERIT_API_KEY }}
        run: |
          set -euo pipefail

          echo "Sending a question to CERIT..."

          HTTP_STATUS=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            https://llm.ai.e-infra.cz/v1/chat/completions \
            -H "Authorization: Bearer $CERIT_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-oss-120b",
              "messages": [
                {
                  "role": "user",
                  "content": "How are you? Reply in one short sentence."
                }
              ],
              "max_tokens": 100,
              "stream": false
            }')

          echo "HTTP status: $HTTP_STATUS"

          # Stop if the API reports an HTTP error.
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "API request failed. Response:"
            jq . response.json
            exit 1
          fi

          # Print the complete JSON response for inspection.
          echo "Complete API response:"
          jq . response.json

          # Extract the standard OpenAI-compatible response fields.
          MODEL=$(jq -r '.model // "unknown"' response.json)
          ANSWER=$(jq -r '.choices[0].message.content // empty' response.json)

          echo
          echo "Model reported by API: $MODEL"
          echo "Model answer:"

          if [ -n "$ANSWER" ]; then
            echo "$ANSWER"
          else
            echo "No answer found in choices[0].message.content."
            echo "Inspect the complete JSON above to see the response format."
            exit 1
          fi

          # Make the answer visible in the GitHub Actions summary.
          {
            echo "## Direct CERIT API Test"
            echo
            echo "**Model reported:** $MODEL"
            echo
            echo "**Question:** How are you?"
            echo
            echo "**Answer:**"
            echo
            echo "$ANSWER"
          } >> "$GITHUB_STEP_SUMMARY"

      # TEST 2: Install the Copilot CLI.
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # TEST 3: Ask Copilot CLI using the CERIT provider.
      - name: Test Copilot with CERIT
        env:
          COPILOT_PROVIDER_BASE_URL: https://llm.ai.e-infra.cz/v1
          COPILOT_PROVIDER_API_KEY: ${{ secrets.CERIT_API_KEY }}
          COPILOT_PROVIDER_TYPE: openai
          COPILOT_MODEL: gpt-oss-120b
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: "100"
        run: |
          set -euo pipefail

          echo "Asking Copilot a question through CERIT..."

          copilot -p \
            "How are you? Reply in one short sentence." \
            --model gpt-oss-120b \
            --silent \
            --no-ask-user \
            > copilot-output.txt

          echo
          echo "Copilot's actual response:"
          cat copilot-output.txt

          if [ ! -s copilot-output.txt ]; then
            echo "ERROR: Copilot returned an empty response."
            exit 1
          fi

          {
            echo "## Copilot via CERIT"
            echo
            echo "**Question:** How are you?"
            echo
            echo "**Answer:**"
            echo
            cat copilot-output.txt
          } >> "$GITHUB_STEP_SUMMARY"
