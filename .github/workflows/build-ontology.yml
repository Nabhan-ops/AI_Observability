name: Build Repository Ontology

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ontology:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout AI_Observability
        uses: actions/checkout@v4
        with:
          path: AI_Observability
          fetch-depth: 1

      - name: Checkout ML_HACKATHON_2022
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ML_HACKATHON_2022
          path: ML_HACKATHON_2022
          fetch-depth: 1

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # Copilot CLI handles repository analysis and creates the files.
      # No Python scripts are used.
      - name: Generate ontology with Copilot CLI
        working-directory: AI_Observability
        env:
          COPILOT_PROVIDER_BASE_URL: https://api.openai.com/v1
          COPILOT_PROVIDER_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOT_PROVIDER_TYPE: openai
          COPILOT_MODEL: gpt-4.1
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: "6000"
          COPILOT_AUTO_UPDATE: "false"
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/agents/ontology-builder.agent.md

          mkdir -p ontology-work/result

          PROMPT=$(cat <<'PROMPT_EOF'
          Analyze both checked-out repositories:
          - AI_Observability
          - ML_HACKATHON_2022

          The current working directory is AI_Observability.
          The sibling repository is ../ML_HACKATHON_2022.

          Read repository documentation, source files, notebooks,
          dependencies, and configuration files. Do not execute
          repository code.

          Follow the ontology-builder custom agent instructions.

          Create these two actual files using your file-writing tools:
          1. ontology-work/result/ontology.json
          2. ontology-work/result/ontology-report.md

          Do not merely print their contents or claim they exist.
          You must write both files to disk.

          The JSON must contain:
          - ontology_name
          - repositories
          - entities
          - relationships
          - shared_technologies
          - possible_connections
          - gaps_and_questions
          - summary

          Each entity must have:
          - id
          - type
          - name
          - description
          - evidence
          - confidence

          Each relationship must have:
          - source_id
          - predicate
          - target_id
          - evidence
          - confidence

          Use unique, stable entity IDs.
          Every relationship must point to existing entities.
          Use repository-relative paths as evidence.

          Separate verified facts, inferences, and hypotheses.
          Shared technologies do not prove direct integration.
          Never invent features or relationships.
          Do not expose secrets or modify source files.

          The Markdown report should explain:
          - What each repository does
          - Important artifacts and technologies
          - Evidence-backed relationships
          - Shared technologies
          - Potential cross-repository connections
          - Gaps, uncertainties, and questions

          Before finishing, read the files you created and check
          that the JSON is valid and relationship IDs exist.

          Return a short status message. Do not print the full ontology.
          PROMPT_EOF
          )

          copilot -p "$PROMPT" \
            --agent ontology-builder \
            --model gpt-4.1 \
            --silent \
            --no-ask-user \
            --allow-tool='read,write' \
            --add-dir ontology-work \
            --add-dir ../ML_HACKATHON_2022 \
            > ontology-work/copilot-output.txt

          # Verify that Copilot actually created the files.
          if [[ ! -s ontology-work/result/ontology.json ]]; then
            echo "::error::Copilot did not create ontology.json"
            cat ontology-work/copilot-output.txt
            exit 1
          fi

          if [[ ! -s ontology-work/result/ontology-report.md ]]; then
            echo "::error::Copilot did not create ontology-report.md"
            cat ontology-work/copilot-output.txt
            exit 1
          fi

          # Validate JSON using a command-line JSON parser, not Python.
          if ! jq -e '
            .ontology_name and
            (.repositories | type == "array") and
            (.entities | type == "array") and
            (.relationships | type == "array") and
            (.shared_technologies != null) and
            (.possible_connections != null) and
            (.gaps_and_questions != null) and
            (.summary != null)
          ' ontology-work/result/ontology.json > /dev/null; then
            echo "::error::Ontology JSON is invalid or missing required fields"
            exit 1
          fi

          # Check unique entity IDs and relationship endpoints.
          jq -e '
            ([.entities[].id] | length) ==
            ([.entities[].id] | unique | length)
            and
            (
              [.entities[].id] as $ids |
              all(
                .relationships[];
                (.source_id as $s | $ids | index($s)) != null
                and
                (.target_id as $t | $ids | index($t)) != null
              )
            )
          ' ontology-work/result/ontology.json > /dev/null

          echo "Ontology files created and validated."
          echo "Entities: $(jq '.entities | length' ontology-work/result/ontology.json)"
          echo "Relationships: $(jq '.relationships | length' ontology-work/result/ontology.json)"

      - name: Publish workflow summary
        if: success()
        shell: bash
        run: |
          {
            echo "# Repository Ontology"
            echo
            cat AI_Observability/ontology-work/result/ontology-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ontology artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-ontology
          path: |
            AI_Observability/ontology-work/result/
            AI_Observability/ontology-work/copilot-output.txt
          if-no-files-found: warn
          retention-days: 14
