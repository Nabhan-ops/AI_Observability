
name: Build Repository Ontology

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ontology:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout AI_Observability
        uses: actions/checkout@v4
        with:
          path: AI_Observability
          fetch-depth: 1

      - name: Checkout ML_HACKATHON_2022
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ML_HACKATHON_2022
          path: ML_HACKATHON_2022
          fetch-depth: 1

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Prepare repository evidence
        shell: bash
        run: |
          set -e
          mkdir -p AI_Observability/ontology-work/result

          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = [
              Path("AI_Observability"),
              Path("ML_HACKATHON_2022"),
          ]

          skip = {
              ".git", ".venv", "venv", "node_modules",
              "__pycache__", ".ipynb_checkpoints",
              "dist", "build", "output", "ontology-work"
          }

          allowed = {
              ".py", ".ipynb", ".md", ".rst", ".txt",
              ".yml", ".yaml", ".toml", ".json",
              ".js", ".ts", ".html", ".sql"
          }

          evidence = []

          for root in roots:
              files = []
              total_chars = 0

              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue

                  rel = path.relative_to(root)

                  if any(part in skip for part in rel.parts):
                      continue

                  if (
                      path.name not in {
                          "README", "README.md", "README.rst",
                          "requirements.txt", "pyproject.toml",
                          "Dockerfile", "environment.yml",
                          "environment.yaml", "setup.py"
                      }
                      and path.suffix.lower() not in allowed
                  ):
                      continue

                  item = {"path": str(rel)}

                  if total_chars < 18000:
                      try:
                          if path.suffix.lower() == ".ipynb":
                              notebook = json.loads(
                                  path.read_text(encoding="utf-8")
                              )
                              parts = []
                              for cell in notebook.get("cells", [])[:10]:
                                  parts.append(
                                      "".join(cell.get("source", []))
                                  )
                              content = "\n\n".join(parts)
                          else:
                              content = path.read_text(
                                  encoding="utf-8",
                                  errors="replace"
                              )

                          content = content[:3000]
                          content = content[:18000 - total_chars]

                          if content:
                              item["excerpt"] = content
                              total_chars += len(content)

                      except Exception:
                          item["excerpt"] = "[Could not read file]"

                  files.append(item)

              evidence.append({
                  "repository": root.name,
                  "files": files
              })

          destination = Path(
              "AI_Observability/ontology-work/evidence.json"
          )
          destination.write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          for repo in evidence:
              print(f"{repo['repository']}: {len(repo['files'])} files")
          PY

      - name: Generate ontology with Copilot CLI
        working-directory: AI_Observability
        env:
          COPILOT_PROVIDER_BASE_URL: https://api.openai.com/v1
          COPILOT_PROVIDER_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOT_PROVIDER_TYPE: openai
          COPILOT_MODEL: gpt-4.1
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: "4000"
          COPILOT_AUTO_UPDATE: "false"
        run: |
          set -e

          test -f .github/agents/ontology-builder.agent.md
          test -f ontology-work/evidence.json

          PROMPT=$(cat <<'PROMPT_EOF'
          Build an evidence-based ontology from ontology-work/evidence.json.

          Follow the ontology-builder agent instructions.

          Create exactly these output files:
          - ontology-work/result/ontology.json
          - ontology-work/result/ontology-report.md

          The JSON must contain:
          ontology_name, repositories, entities, relationships,
          shared_technologies, possible_connections,
          gaps_and_questions, summary.

          Entities need stable unique IDs, types, names, descriptions,
          evidence and confidence.

          Relationships need source_id, predicate, target_id,
          evidence and confidence.

          Check both repositories separately, then compare them.
          Identify artifacts, technologies, capabilities, goals,
          data formats, models, workflows and external services
          when supported by evidence.

          Use repository-relative file paths for evidence.
          Separate verified relationships from hypotheses.
          Shared technologies alone do not prove direct integration.
          Do not invent facts, expose secrets, execute repository code,
          or modify source files.

          Validate the JSON and ensure every relationship points
          to an existing entity. Explain findings and uncertainties
          in the Markdown report.

          Do not print the full ontology in your final response.
          Confirm the paths of the two files when finished.
          PROMPT_EOF
          )

          copilot -p "$PROMPT" \
            --agent ontology-builder \
            --model gpt-4.1 \
            --silent \
            --no-ask-user \
            --add-dir ontology-work \
            > ontology-work/copilot-output.txt

          cat ontology-work/copilot-output.txt

          test -s ontology-work/result/ontology.json
          test -s ontology-work/result/ontology-report.md

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("ontology-work/result/ontology.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "ontology_name", "repositories", "entities",
              "relationships", "shared_technologies",
              "possible_connections", "gaps_and_questions", "summary"
          ]

          missing = [key for key in required if key not in data]
          if missing:
              raise ValueError(f"Missing JSON keys: {missing}")

          entity_ids = [
              entity.get("id")
              for entity in data["entities"]
              if isinstance(entity, dict)
          ]

          if len(entity_ids) != len(set(entity_ids)):
              raise ValueError("Duplicate entity IDs found")

          known_ids = set(entity_ids)

          for relationship in data["relationships"]:
              if relationship.get("source_id") not in known_ids:
                  raise ValueError(
                      "Relationship references unknown source entity"
                  )
              if relationship.get("target_id") not in known_ids:
                  raise ValueError(
                      "Relationship references unknown target entity"
                  )

          print("Ontology JSON validated successfully.")
          print("Entities:", len(data["entities"]))
          print("Relationships:", len(data["relationships"]))
          PY

      - name: Publish workflow summary
        if: success()
        run: |
          {
            echo "# Repository Ontology"
            echo
            cat AI_Observability/ontology-work/result/ontology-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ontology artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-ontology
          path: |
            AI_Observability/ontology-work/result/
            AI_Observability/ontology-work/evidence.json
            AI_Observability/ontology-work/copilot-output.txt
          if-no-files-found: warn
          retention-days: 14
