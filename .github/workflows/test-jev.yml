
name: Test Jev Ontology Decisions

on:
  workflow_dispatch:

jobs:
  test-jev:
    runs-on: ubuntu-latest

    steps:
      - name: Call Jev API
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail

          # Send a request to TypeSafe's Jev model.
          response=$(curl --fail-with-body --silent --show-error \
            https://api.typesafe.ai/v1/systemone \
            -H "Authorization: Bearer $JEV_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "jev-latest",
              "state": {
                "proposed_relationship": "video-service CALLS workflow-engine",
                "evidence": "The README explicitly states: video-service sends transcription requests to workflow-engine."
              },
              "questions": {
                "supported": {
                  "type": "noul",
                  "instructions": "Does the evidence support the proposed relationship?",
                  "criteria": {
                    "true": "The evidence directly supports the relationship.",
                    "false": "The evidence does not directly support the relationship."
                  }
                },
                "classification": {
                  "type": "choice",
                  "instructions": "Classify the relationship based on the supplied evidence.",
                  "criteria": {
                    "supported": "The evidence directly supports the relationship.",
                    "contradicted": "The evidence directly contradicts the relationship.",
                    "unclear": "The evidence is insufficient to decide."
                  }
                },
                "evidence_strength": {
                  "type": "score",
                  "instructions": "Rate the strength of the evidence.",
                  "criteria": [
                    "No supporting evidence",
                    "Weak or indirect evidence",
                    "Clear direct evidence"
                  ]
                }
              }
            }')

          # Print Jev's actual response.
          echo "$response" | jq .

          # Display each decision separately.
          echo "Noul probability:"
          echo "$response" | jq '.answers.supported.noul'

          echo "Choice decision:"
          echo "$response" | jq '.answers.classification.choice'

          echo "Evidence score:"
          echo "$response" | jq '.answers.evidence_strength.score'
